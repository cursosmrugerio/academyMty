# ---------------------------------------------------------------------------------------------------
# taskflow-mcp: configuración
# ---------------------------------------------------------------------------------------------------

# --- El protocolo viaja por stdout: NADA más puede escribirse ahí -----------------------------------
# Copilot CLI lee la salida estándar de este proceso esperando mensajes JSON-RPC, uno por línea.
# Un banner, un log o un System.out.println en medio rompen el protocolo y el servidor aparece
# desconectado. Por eso: sin servidor web, sin banner y sin logs en consola.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.threshold.console=OFF

# --- El servidor MCP ---------------------------------------------------------------------------------
# stdio=true: el transporte es la entrada/salida estándar (lo contrario sería HTTP).
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=taskflow-mcp
spring.ai.mcp.server.version=1.0.0

# --- A qué TaskFlow se conecta ------------------------------------------------------------------------
# Cada valor se puede cambiar con una variable de entorno; si no existe, se usa el de después de ':'.
#   TASKFLOW_URL       dónde corre la API          (por defecto http://localhost:8080)
#   TASKFLOW_USER      con qué usuario hace login  (por defecto ana)
#   TASKFLOW_PASSWORD  su contraseña               (por defecto ana123)
# ana/ana123 son datos de la SEMILLA DE DEMOSTRACIÓN que DataSeeder crea con el perfil h2: no son un
# secreto. Con una API de verdad, la contraseña iría solo en la variable de entorno, nunca aquí.
taskflow.url=${TASKFLOW_URL:http://localhost:8080}
taskflow.user=${TASKFLOW_USER:ana}
taskflow.password=${TASKFLOW_PASSWORD:ana123}
