<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/projects.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a href="projects.html" class="navbar-brand">TaskFlow</a>
        <div class="navbar-user">
            <span data-testid="nav-username"></span>
            <button class="btn btn-secondary btn-sm" data-testid="btn-logout">Logout</button>
        </div>
    </header>

    <main class="container">
        <div class="project-header">
            <h1>Mis Proyectos</h1>
            <button class="btn btn-primary" data-testid="btn-new-project">Nuevo Proyecto</button>
        </div>
        <div class="project-cards" data-testid="project-list">
            <!-- Las tarjetas de proyecto se insertarán aquí dinámicamente -->
        </div>
    </main>
    
    <div data-testid="help-panel" class="help-panel hidden">
        <iframe data-testid="iframe-help" src="help.html"></iframe>
    </div>
    <button class="btn btn-secondary help-toggle" data-testid="btn-help-toggle">Ayuda</button>

    <footer>
        <p>TaskFlow UI v1.0.0 - Solo para fines de demostración.</p>
    </footer>
    <div data-testid="toast-container"></div>
</body>
</html>
