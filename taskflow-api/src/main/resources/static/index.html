<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <h2>Iniciar Sesión en TaskFlow</h2>
        <form id="login-form">
            <div id="error-container"></div>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="form-control" data-testid="input-username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" data-testid="input-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-testid="btn-login">Entrar</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            ¿No tienes una cuenta? <a href="register.html" data-testid="link-register">Regístrate</a>
        </p>
    </div>

    <footer>
        <p>TaskFlow UI v1.0.0 - Solo para fines de demostración.</p>
    </footer>
    <div data-testid="toast-container"></div>
</body>
</html>
